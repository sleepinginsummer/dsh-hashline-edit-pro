name: Publish npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
      - name: Require release notes section
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "::error::RELEASE_NOTES.md is missing — create it and add a '## ${GITHUB_REF_NAME}' section before tagging."
            exit 1
          fi
          if ! grep -q "^## ${GITHUB_REF_NAME}$" RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md has no '## ${GITHUB_REF_NAME}' section — add the release notes for this version before tagging (see template in the file header)."
            exit 1
          fi

      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="dsh-hashline-edit-pro"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if npm publish --provenance --access public; then
            exit 0
          fi
          if [ "$(npm view "${PACKAGE}@${VERSION}" version 2>/dev/null || true)" = "${VERSION}" ]; then
            echo "${PACKAGE}@${VERSION} already published, skip"
            exit 0
          fi
          exit 1

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          # 1) RELEASE_NOTES.md 中的 "## vX.Y.Z" 章节优先（人工维护的详细说明）
          if [ -f RELEASE_NOTES.md ]; then
            awk -v ver="${GITHUB_REF_NAME}" '
              /^## / { if ($0 == "## " ver) { in_section = 1 } else if (in_section) { exit } }
              in_section { print }
            ' RELEASE_NOTES.md > release-notes.md
          fi
          # 2) 没有章节 → 从 git log 自动生成（上个 tag 以来的提交）
          if [ ! -s release-notes.md ]; then
            PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            {
              echo "## What's Changed"
              if [ -n "${PREV}" ]; then
                git log --pretty=format:'* %s' "${PREV}..${GITHUB_REF_NAME}"
                echo
                echo
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
              else
                git log --pretty=format:'* %s' "${GITHUB_REF_NAME}"
              fi
            } > release-notes.md
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --latest ||
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file release-notes.md \
            --latest
